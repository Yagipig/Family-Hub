name: Sao luu CSDL hang ngay
on:
  schedule:
    - cron: "17 18 * * *"   # 18:17 UTC = 03:17 gio Nhat Ban (UTC+9), 01:17 gio Viet Nam
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cai cong cu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          # pg_dump phai co phien ban >= phien ban Postgres cua Supabase (doi 17 neu can)
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Sao luu va ma hoa
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: /usr/lib/postgresql/17/bin/pg_dump --version && PATH=/usr/lib/postgresql/17/bin:$PATH ./scripts/backup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: family-hub-backup
          path: backups/*.age
          retention-days: 30
          if-no-files-found: error
